name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Tests only. Deploys and database migrations run in Cloudflare Workers Builds
# (see docs/DEPLOYMENT.md); this workflow never holds Cloudflare or database secrets.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A throwaway Postgres for integration tests. These credentials exist only inside this job.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: migrator
          POSTGRES_PASSWORD: migrator
          POSTGRES_DB: astro_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U migrator" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://migrator:migrator@127.0.0.1:5432/astro_test
      # The landing build normally fetches the published wording from the live app; CI builds with the defaults.
      COPY_SOURCE: defaults
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Create the runtime roles used by grants
        run: |
          psql "$DATABASE_URL_TEST" -c "create role astro_web login password 'astro_web'"
          psql "$DATABASE_URL_TEST" -c "create role astro_admin login password 'astro_admin'"
      - name: Database integration tests
        run: pnpm db:test
      - name: CPU budget for the data Worker (Workers Free, 10 ms per request)
        run: pnpm --filter @astro/api test:cpu
      - run: pnpm build
      - name: Local settings for wrangler dev (development values only)
        run: |
          cp apps/app/.dev.vars.example apps/app/.dev.vars
          cp apps/admin/.dev.vars.example apps/admin/.dev.vars
      - name: End-to-end tests
        run: pnpm e2e
        env:
          CI: "true"
