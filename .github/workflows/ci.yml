name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Tests only. Deploys and database migrations run in Cloudflare Workers Builds
# (see docs/DEPLOYMENT.md); this workflow never holds Cloudflare or database secrets.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: End-to-end tests
        run: pnpm e2e
        env:
          CI: "true"
